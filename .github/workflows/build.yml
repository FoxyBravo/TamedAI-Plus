name: Build & Release

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: "10.0.x"
  VS_VERSION: "1.20.7"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache Vintage Story SDK
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: /tmp/vintagestory
          key: ${{ runner.os }}-vs-${{ env.VS_VERSION }}

      - name: Download and extract Vintage Story SDK
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/vintagestory
          curl -sL "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-${{ env.VS_VERSION }}.tar.gz" \
            | tar xz -C /tmp/vintagestory

      - name: Set VINTAGE_STORY
        run: echo "VINTAGE_STORY=/tmp/vintagestory" >> $GITHUB_ENV

      - name: Build & Package
        run: dotnet run --project CakeBuild/CakeBuild.csproj -- --skipDownloadLang true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamedaiplus-package
          path: Releases/*.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zipfile="$(find Releases -name '*.zip' | head -1)"
          version="$(echo "$zipfile" | sed 's/.*_v//;s/\.zip//')"
          gh release create "v$version" "$zipfile" --generate-notes
